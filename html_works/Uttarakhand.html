<!DOCTYPE html>
<html>
    <head>
         <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <title>
            Uttarakhand state
        </title>
           <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
           <style>
            .e1{
                background-color:forestgreen;
                color:ivory;
                text-align:center;
                font-weight:bolder;
                padding:25px;
                border: 4px dashed ivory;
            }
            #map1 {
                 position: relative;
                width:100%;
                height:600px;
            }
            
            .l_m {
                  position: absolute;              
                  bottom: 20px;
                  left: 20px;
                  z-index: 1000;
                  background: white;
                  padding: 10px 15px;
                  border-radius: 6px;
                  box-shadow: 0 0 5px rgba(0,0,0,0.4);
                  font-weight: normal;
                  text-align: left;
                }

            .l_m span {
                 display: inline-block;
                 width: 15px;
                 height: 15px;
                 margin-right: 8px;
                 border-radius: 3px;
                 vertical-align: middle;
                }

            #red { 
                 background-color: red; 
                 }
            #yellow {
                 background-color: yellow; 
                }
            #green { 
                background-color: green;
             }
               @media (max-width: 699px) {
    #map1 {
        height: 500px;
    }

    .l_m {
        bottom: 10px;
        left: 10px;
        padding: 8px 10px;
        font-size: 12px;
    }

    .l_m p {
        margin: 5px 0;
    }

    .l_m span {
        width: 12px;
        height: 12px;
        margin-right: 5px;
    }
}
           
        </style>
    </head>
    <body>
        <div class="e1">
            <h1>
                Uttarakhand State
            </h1>
        </div>
        <div id="map1">
    <div class="l_m">
        <p>
            <span id="red"></span>
            Forest cover < 5%
        </p>
        <p>
            <span id="yellow"></span>
            Forest cover from 5%-15%
        </p>
        <p>
            <span id="green"></span>
            forest cover > 15%
        </p>
    </div>
</div>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
        </script>

     <script>
const map = L.map("map1").setView([30.06, 79.02], 8);



fetch("../json_files/uttarakhand.geojson")
    .then(response => response.json())
    .then(data => {
  const uttarakhand=L.geoJSON(data, { 
                    style: function(feature) {
                        return{ 
                        color:"black",
                        weight:2,
                        fillColor:feature.properties.color,
                        fill0pacity:1
                        };
                    },
                    onEachFeature: function(feature,layer){
                        layer.bindPopup (
                            '<b>' + feature.properties["district"] + '</b><br>' +
                             "Forest Cover: " + feature.properties["Forest Cover"] +'<br>'+
                              "Afforestation Status:  " + feature.properties["Afforestation Status"]
                    );
    }
     }).addTo(map);
             })    .catch(error => console.error("GeoJSON Error:", error));
   
</script>
    </body>

</html>
